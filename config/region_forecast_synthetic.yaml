columns:
  aircraft_id: "target_id"
  trajectory_id: "target_id"
  time: "timestamp"
  lat: "latitude"
  lon: "longitude"
  altitude: "altitude"
  speed: "speed"
  heading: "rotation"
  vertical_rate: "vrate"
  aircraft_type: "aircraft_type"
  nationality: "nationality"
  callsign: "callsign"

aoi:
  enabled: false
  name: "global"
  mode: "global"

grid:
  kind: "h3"
  h3_resolution: 4
  input_parent_resolution: 3
  target_h3_resolutions: [3, 3, 3, 2]
  coarse_h3_resolutions: [2, 2, 2, 1]

dataset:
  input_path: "data/sim_csv"
  input_format: "csv"
  file_pattern: "*.csv"
  aircraft_type_map_path: "data/aircraft_type_map.csv"
  scope: "global"
  name: null
  default_aircraft_type: "unknown_type"
  sample_interval_minutes: 10
  history_minutes: 60
  horizons_minutes: [30, 60, 120, 300]
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_trajectories: null
  mission_gap_minutes: 90
  max_interpolate_gap_minutes: 30
  ground_altitude_m: 300.0
  ground_speed_threshold: 30.0
  ground_vrate_threshold: 5.0
  ground_stop_minutes: 30
  min_segment_points: 10
  split_unit: "aircraft"

model:
  model_type: "hierarchical_gru"
  embedding_dim: 128
  parent_embedding_dim: 64
  numeric_projection_dim: 64
  mask_projection_dim: 16
  context_projection_dim: 32
  hidden_dim: 256
  num_layers: 3
  dropout: 0.2
  child_context_dim: 64
  enable_retrieval: false
  retrieval_top_k: 8

training:
  batch_size: 256
  epochs: 100
  min_epochs: 10
  learning_rate: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  num_workers: 8
  device: "cuda"
  amp: true
  pin_memory: true
  persistent_workers: true
  lr_scheduler_patience: 8
  lr_scheduler_factor: 0.5
  early_stopping_patience: 15
  seed: 42

evaluation:
  top_ks: [1, 3, 5]
  calibration_bins: 10
  neighbor_hit_rings: [1, 2, 2, 1]
  candidate_probability_mass: [0.85, 0.8, 0.8, 0.94]
  candidate_top_cells: [24, 18, 12, 24]
  prediction_examples: 24
  hierarchical_parent_top_k: [64, 48, 16, 12]

catalog:
  include_global: true
  evaluate_after_training: true
  min_rows_per_type: 100
  min_aircraft_per_type: null
  max_types: null
  skip_existing: false

output:
  root_dir: "artifacts"
  run_name: "synthetic_h3_movement_gru"
