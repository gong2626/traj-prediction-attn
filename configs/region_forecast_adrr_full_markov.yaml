columns:
  aircraft_id: "target_id"
  trajectory_id: "target_id"
  time: "timestamp"
  lat: "latitude"
  lon: "longitude"
  altitude: "altitude"
  speed: "speed"
  heading: "rotation"
  vertical_rate: "vrate"
  aircraft_type: "aircraft_type"
  nationality: "nationality"
  callsign: "callsign"

aoi:
  enabled: false
  name: "global"
  mode: "global"

grid:
  kind: "h3"
  h3_resolution: 3
  input_parent_resolution: 2
  target_h3_resolutions: [3, 3, 2, 2]
  coarse_h3_resolutions: [2, 2, 1, 1]

dataset:
  input_path: "data/adrr_202403_shards"
  input_format: "parquet"
  file_pattern: "adrr_202403_shard_*.parquet"
  aircraft_type_map_path: null
  scope: "global"
  name: null
  default_aircraft_type: "unknown_type"
  sample_interval_minutes: 5
  history_minutes: 30
  horizons_minutes: [10, 30, 60, 120]
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_trajectories: null
  mission_gap_minutes: 90
  max_interpolate_gap_minutes: 30
  ground_altitude_m: 300.0
  ground_speed_threshold: 30.0
  ground_vrate_threshold: 5.0
  ground_stop_minutes: 10
  min_segment_points: 8
  split_unit: "aircraft"

model:
  model_type: "markov"

training:
  batch_size: 1024
  num_workers: 0
  device: "cpu"
  amp: false
  pin_memory: false
  persistent_workers: false
  seed: 42

evaluation:
  top_ks: [1, 3, 5]
  calibration_bins: 10
  neighbor_hit_rings: [1, 1, 1, 1]
  candidate_probability_mass: [0.8, 0.8, 0.8, 0.8]
  candidate_top_cells: [24, 18, 18, 24]
  prediction_examples: 24
  hierarchical_parent_top_k: [64, 48, 48, 12]
  reachable_filter_enabled: true
  reachable_max_speed_kts: 750.0
  reachable_margin_km: 250.0
  h3_refinement_enabled: false
  h3_refinement_alpha: [0.0, 0.0, 0.0, 0.0]
  h3_refinement_ring: [1, 1, 1, 1]
  h3_refinement_preserve_unknown: true
  checkpoint_run_name: null

output:
  root_dir: "artifacts"
  run_name: "global_markov_baseline"
