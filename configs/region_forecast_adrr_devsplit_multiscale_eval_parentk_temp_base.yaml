columns:
  aircraft_id: "target_id"
  trajectory_id: "target_id"
  time: "timestamp"
  lat: "latitude"
  lon: "longitude"
  altitude: "altitude"
  speed: "speed"
  heading: "rotation"
  vertical_rate: "vrate"
  aircraft_type: "aircraft_type"
  nationality: "nationality"
  callsign: "callsign"

aoi:
  enabled: false
  name: "global"
  mode: "global"

grid:
  kind: "h3"
  h3_resolution: 3
  input_parent_resolution: 2
  target_h3_resolutions: [3, 3, 2, 2]
  coarse_h3_resolutions: [2, 2, 1, 1]

dataset:
  input_path: "data/adrr_202403_shards"
  input_format: "parquet"
  file_pattern: "adrr_202403_shard_*.parquet"
  aircraft_type_map_path: null
  scope: "global"
  name: null
  default_aircraft_type: "unknown_type"
  sample_interval_minutes: 5
  history_minutes: 30
  horizons_minutes: [10, 30, 60, 120]
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  max_trajectories: null
  mission_gap_minutes: 90
  max_interpolate_gap_minutes: 30
  ground_altitude_m: 300.0
  ground_speed_threshold: 30.0
  ground_vrate_threshold: 5.0
  ground_stop_minutes: 10
  min_segment_points: 8
  split_unit: "aircraft"

model:
  model_type: "multiscale_transformer_h3"
  embedding_dim: 128
  parent_embedding_dim: 64
  numeric_projection_dim: 64
  mask_projection_dim: 16
  context_projection_dim: 32
  hidden_dim: 256
  num_layers: 3
  dropout: 0.15
  child_context_dim: 64
  enable_retrieval: false
  retrieval_top_k: 8
  temporal_attention_dim: 128
  temporal_attention_dropout: 0.0
  horizon_embedding_dim: 32
  transformer_num_layers: 2
  transformer_num_heads: 4
  transformer_ffn_dim: 512
  transformer_dropout: 0.05
  multiscale_stride: 2
  multiscale_num_layers: 1

training:
  batch_size: 1024
  epochs: 60
  min_epochs: 8
  learning_rate: 0.00015
  weight_decay: 0.0001
  grad_clip: 1.0
  num_workers: 8
  device: "cuda"
  amp: true
  pin_memory: true
  persistent_workers: true
  lr_scheduler_patience: 4
  lr_scheduler_factor: 0.5
  lr_scheduler_threshold: 0.0003
  lr_scheduler_threshold_mode: "abs"
  early_stopping_patience: 8
  early_stopping_min_delta: 0.0003
  horizon_consistency_weight: 0.0
  horizon_consistency_gap_scaled: true
  auto_resume: false
  resume_from_checkpoint: null
  save_last_checkpoint: true
  seed: 42

evaluation:
  top_ks: [1, 3, 5]
  calibration_bins: 10
  neighbor_hit_rings: [1, 1, 1, 1]
  candidate_probability_mass: [0.8, 0.8, 0.8, 0.8]
  candidate_top_cells: [24, 18, 18, 24]
  prediction_examples: 24
  hierarchical_parent_top_k: [64, 48, 48, 12]
  hierarchical_coarse_temperature: [1.0, 1.0, 1.0, 1.0]
  hierarchical_child_temperature: [1.0, 1.0, 1.0, 1.0]
  reachable_filter_enabled: true
  reachable_max_speed_kts: 750.0
  reachable_margin_km: 250.0
  h3_refinement_enabled: false
  h3_refinement_alpha: [0.0, 0.0, 0.0, 0.0]
  h3_refinement_ring: [1, 1, 1, 1]
  h3_refinement_preserve_unknown: true
  checkpoint_run_name: "adrr_devsplit_multiscale_transformer_h3_tuned"

catalog:
  include_global: true
  evaluate_after_training: true
  min_rows_per_type: 200
  min_aircraft_per_type: null
  max_types: null
  skip_existing: false

output:
  root_dir: "artifacts/research_devsplit"
  run_name: "adrr_devsplit_multiscale_eval_parentk_temp_base"
